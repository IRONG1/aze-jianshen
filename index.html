<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>阿泽古法健身｜直播回放</title>
  <meta name="description" content="阿泽古法健身每日直播回放页面" />
  <style>
    :root {
      --bg: #FFF8F3;
      --card: #FFFFFF;
      --text: #1F2937;
      --muted: #6B7280;
      --primary: #FF6B4A;
      --primary-dark: #F0522E;
      --green: #22C55E;
      --green-dark: #15803D;
      --border: #F3E8E2;
      --shadow: 0 12px 30px rgba(31, 41, 55, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
        "Microsoft YaHei", Arial, sans-serif;
      background:
        radial-gradient(circle at 12% 6%, rgba(255,107,74,.16), transparent 28%),
        radial-gradient(circle at 90% 18%, rgba(34,197,94,.14), transparent 30%),
        linear-gradient(180deg, #FFFDFB 0%, var(--bg) 100%);
      color: var(--text);
    }

    button, a {
      font: inherit;
    }

    .container {
      width: min(100% - 24px, 430px);
      margin: 0 auto;
    }

    .hidden {
      display: none !important;
    }

    /* 首页 */
    .home {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 0 calc(24px + env(safe-area-inset-bottom));
    }

    .home-card {
      width: 100%;
      position: relative;
      overflow: hidden;
      background: rgba(255,255,255,.92);
      border-radius: 28px;
      padding: 34px 22px 26px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .home-card::before {
      content: "";
      position: absolute;
      top: -58px;
      right: -58px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(255,107,74,.16);
    }

    .home-card::after {
      content: "";
      position: absolute;
      left: -48px;
      bottom: -52px;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: rgba(34,197,94,.14);
    }

    .home-inner {
      position: relative;
      z-index: 1;
    }

    .avatar {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #FFE5DD;
      box-shadow: 0 8px 18px rgba(255, 107, 74, 0.18);
    }

    .name {
      margin: 18px 0 8px;
      font-size: 32px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .desc {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .main-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 54px;
      border: none;
      border-radius: 17px;
      background: linear-gradient(135deg, var(--primary), #FF8A65);
      color: white;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(255, 107, 74, 0.22);
    }

    .main-btn:active {
      transform: scale(.98);
    }

    /* 回放页 */
    .replay-page {
      min-height: 100vh;
      padding: calc(10px + env(safe-area-inset-top)) 0 calc(32px + env(safe-area-inset-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 -12px 12px;
      padding: 8px 12px 10px;
      background: rgba(255,248,243,.86);
      backdrop-filter: blur(14px);
    }

    .back-btn {
      border: none;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 6px 14px rgba(31,41,55,.05);
    }

    .page-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .banner {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      height: 190px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      background: #ddd;
    }

    .banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(31,41,55,0.68) 0%, rgba(31,41,55,0.25) 70%, rgba(31,41,55,0.08) 100%);
      display: flex;
      align-items: flex-end;
      padding: 20px;
    }

    .banner-text h1 {
      margin: 0 0 8px;
      color: #fff;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: -1px;
    }

    .banner-text p {
      margin: 0;
      color: rgba(255,255,255,0.92);
      font-size: 13px;
      line-height: 1.6;
    }

    .section-title {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 0 12px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }

    .section-title span {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .video-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .video-item {
      background: rgba(255,255,255,.94);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 8px 20px rgba(31, 41, 55, 0.04);
    }

    .video-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .video-date {
      display: inline-block;
      padding: 6px 10px;
      background: #ECFDF3;
      color: var(--green-dark);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .video-index {
      min-width: 28px;
      height: 28px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: #FFF0E7;
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 900;
    }

    .video-title {
      margin: 0 0 7px;
      font-size: 17px;
      line-height: 1.45;
      font-weight: 900;
    }

    .video-desc {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 13px;
    }

    .video-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 46px;
      padding: 0 16px;
      text-decoration: none;
      color: white;
      background: linear-gradient(135deg, var(--green), var(--primary));
      border-radius: 14px;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(34,197,94,.18);
    }

    .video-btn:active {
      transform: scale(.985);
    }

    .pagination {
      position: sticky;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 16px -12px 0;
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
      background: rgba(255,248,243,.88);
      backdrop-filter: blur(14px);
    }

    .page-btn {
      flex: 1;
      border: none;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      min-height: 42px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(31,41,55,.05);
    }

    .page-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .page-info {
      min-width: 76px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <!-- 首页 -->
  <section id="homePage" class="home">
    <div class="container">
      <div class="home-card">
        <div class="home-inner">
          <!-- 这里替换成你的头像 -->
          <img
            class="avatar"
            src="https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?auto=format&fit=crop&w=400&q=80"
            alt="头像"
          />

          <div class="name">阿泽古法健身</div>
          <p class="desc">每日健身直播回放 · 碎片时间也能跟练，陪你一起健康减脂、轻松塑形。</p>

          <button class="main-btn" onclick="goReplayPage()">直播回放</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 回放页 -->
  <section id="replayPage" class="replay-page hidden">
    <div class="container">
      <div class="topbar">
        <button class="back-btn" onclick="goHomePage()">← 返回首页</button>
        <div class="page-title">阿泽古法健身</div>
      </div>

      <div class="banner">
        <!-- 这里替换成你的横幅图 -->
        <img
          src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1200&q=80"
          alt="直播回放横幅"
        />
        <div class="banner-overlay">
          <div class="banner-text">
            <h1>每日直播回放</h1>
            <p>坚持每天一点点，轻松养成健康好身材。跟着练，更容易坚持。</p>
          </div>
        </div>
      </div>

      <div class="section-title">
        <h2>今日 / 往期回放</h2>
        <span id="totalCount"></span>
      </div>

      <div id="videoList" class="video-list"></div>

      <div class="pagination">
        <button id="prevBtn" class="page-btn" onclick="prevPage()">上一页</button>
        <span id="pageInfo" class="page-info"></span>
        <button id="nextBtn" class="page-btn" onclick="nextPage()">下一页</button>
      </div>
    </div>
  </section>

  <script>
    // =========================
    // 这里每天更新你的回放数据
    // 每页固定显示 7 个
    // =========================
    const videos = [
      {
        date: "2026/4/28",
        title: "2026/4/28 9点场直播回放",
        desc: "点击按钮观看本场直播回放",
        url: "https://www.youtube.com/shorts/Cun3geEUI7o"
      },
      {
        date: "2026/4/28",
        title: "2026/4/28 9点场直播回放",
        desc: "点击按钮观看本场直播回放",
        url: "https://www.youtube.com/shorts/39v6V4ZRE48"
      },
      {
        date: "2026/4/28",
        title: "2026/4/28 9点场直播回放",
        desc: "点击按钮观看本场直播回放",
        url: "https://www.youtube.com/shorts/YCfW0xJn2rc"
      },
      {
        date: "2026/4/28",
        title: "2026/4/28 9点场直播回放",
        desc: "点击按钮观看本场直播回放",
        url: "https://www.youtube.com/shorts/-bJ9m4eGNc4"
      },
      {
        date: "2026/4/28",
        title: "2026/4/28 9点场直播回放",
        desc: "点击按钮观看本场直播回放",
        url: "https://www.youtube.com/shorts/EM_qs-ICD6M"
      },
      {
        date: "2026/4/28",
        title: "2026/4/28 9点场直播回放",
        desc: "点击按钮观看本场直播回放",
        url: "https://www.youtube.com/shorts/HEhf2uN9HLw"
      },
      {
        date: "2026/4/28",
        title: "2026/4/28 9点场直播回放",
        desc: "点击按钮观看本场直播回放",
        url: "https://www.youtube.com/shorts/855U7uh-lpU"
      }
    ];

    const homePage = document.getElementById("homePage");
    const replayPage = document.getElementById("replayPage");
    const videoList = document.getElementById("videoList");
    const totalCount = document.getElementById("totalCount");
    const pageInfo = document.getElementById("pageInfo");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    const pageSize = 7;
    let currentPage = 1;

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function goReplayPage() {
      homePage.classList.add("hidden");
      replayPage.classList.remove("hidden");
      renderVideos();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function goHomePage() {
      replayPage.classList.add("hidden");
      homePage.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderVideos() {
      const totalPages = Math.max(1, Math.ceil(videos.length / pageSize));
      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      const currentVideos = videos.slice(start, end);

      videoList.innerHTML = currentVideos.map((video, index) => `
        <div class="video-item">
          <div class="video-row">
            <div class="video-date">${escapeHtml(video.date)}</div>
            <div class="video-index">${start + index + 1}</div>
          </div>
          <h3 class="video-title">${escapeHtml(video.title)}</h3>
          <p class="video-desc">${escapeHtml(video.desc || "")}</p>
          <a class="video-btn" href="${escapeHtml(video.url)}" target="_blank" rel="noopener noreferrer">点击观看回放</a>
        </div>
      `).join("");

      totalCount.textContent = `共 ${videos.length} 个视频`;
      pageInfo.textContent = `第 ${currentPage} / ${totalPages} 页`;
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages || totalPages === 0;
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        renderVideos();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function nextPage() {
      const totalPages = Math.max(1, Math.ceil(videos.length / pageSize));
      if (currentPage < totalPages) {
        currentPage++;
        renderVideos();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }
  </script>
</body>
</html>
